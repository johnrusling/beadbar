name: Keep Supabase awake

# Supabase free projects pause after 7 days of inactivity. This pings the
# REST API daily so the project never goes to sleep. The request hits Postgres
# (RLS returns an empty 200 for the anon key), which counts as activity.

on:
  schedule:
    - cron: "17 6 * * *" # daily at 06:17 UTC
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/materials?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase responded with HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Unexpected status $code — keep-alive ping failed"
            exit 1
          fi
